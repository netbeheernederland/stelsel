id: https://modellen.netbeheernederland.nl/stelsel/registers/marktactiviteitenregister
name: marktactiviteitenregister
title: Marktactiviteitenregister
version: "1.3-draft"
description: Het marktactiviteitenregister bevat alle economische activiteiten die door netbeheerders worden gecoördineerd op het niveau van een aansluiting, allocatiepunt of systeemkoppeling.
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/marktactiviteitenregister#
  aansluitingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/aansluitingenregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  energiewet: https://wetten.overheid.nl/jci1.3:c:BWBR0050714&
  iceg: https://wetten.overheid.nl/jci1.3:c:BWBR0037934&
  rge: https://www.internetconsultatie.nl/regeling_gegevensuitwisseling_energiewet/b1#
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst
annotations:
  changes: |
    - `Systeemkoppeling` toegevoegd, omdat marktpartijen daarop actief kunnen zijn.
    - `Melding leveringsovereenkomst` vervallen: komt niet terug in de Regeling gegevensuitwisseling Energiewet.
    - `dynamische of tijdsafhankelijke leveringsprijs` toegevoegd, om te bepalen of een leverancier recht heeft op meetgegevens per kwartier.
    - Tijdlijnen vervangen door tijdseigenschappen, omdat tijdlijnen alleen kunnen worden toegepast op entiteiten met een niet-herbruikbare identificatie.

classes:
  Leveringsovereenkomst:
    class_uri: Leveringsovereenkomst
    related_mappings:
      - begrip:ihyma #marktactiviteit
    description: overeenkomst voor de levering van elektriciteit of gas aan een eindafnemer
    source: energiewet:g=2025-07-01
    see_also:
      - rge:artikel=2.18
    attributes:
      begindatum:
        description: dag waarop de overeenkomst van kracht wordt
        range: Datum
      einddatum:
        description: dag waarop de overeenkomst afloopt dan wel automatisch wordt verlengd
        range: Datum
      opzegtermijn:
        description: aantal dagen tussen opzegging en beëindiging van de overeenkomst
        range: Geheel getal
      # relaties:
      met:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      op:
        range: Allocatiepunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begindatum
          - met
          - op
  Marktactiviteit:
    class_uri: Marktactiviteit
    exact_mappings:
      - begrip:ihyma #marktactiviteit
    see_also:
      - iceg:hoofdstuk=2&paragraaf=2.1&g=2025-01-01
    attributes:
      beginmoment:
        description: eerste tijdstip waarop iets geldt
        range: Tijdstip
        required: true
      eindmoment:
        description: eerste tijdstip waarop iets niet meer geldt
        range: Tijdstip
      dienst:
        description: soort marktactiviteit dat door een marktpartij op een aansluiting of allocatiepunt wordt verricht
        range: Dienst
        required: true
      dynamische of tijdsafhankelijke leveringsprijs:
        description: geeft aan of de prijs voor geleverde of teruggeleverde energie afhankelijk is van het moment waarop het leveren of terugleveren plaatsvindt, waarbij de prijsperiodes afwijken van de normaal- en laaguren
        comments:
          - Alleen van toepassing bij levering en teruglevering.
        range: Waarheidswaarde
      # relaties:
      op:
        range: Any
        exactly_one_of:
          - range: Aansluiting
          - range: Allocatiepunt
          - range: Systeemkoppeling
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      van:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - dienst
          - op

  # externe entiteiten:
  Aansluiting:
    class_uri: aansluitingenregister:aansluiting
    annotations:
      external_registry: Aansluitingenregister
  Allocatiepunt:
    class_uri: aansluitingenregister:allocatiepunt
    annotations:
      external_registry: Aansluitingenregister
  Any:
    class_uri: linkml:Any
  Marktpartijsubregistratie:
    class_uri: marktpartijenregister:Marktpartijsubregistratie
    annotations:
      external_registry: Marktpartijenregister
  Systeemkoppeling:
    class_uri: aansluitingenregister:systeemkoppeling
    annotations:
      external_registry: Aansluitingenregister

enums:
  Dienst:
    permissible_values:
      (terug)levering:
      balanceringsverantwoordelijkheid:
      meterbeheer:
      bieding redispatch:
      capaciteitssturing:
      FCR:
      aFRR:
      noodvermogen:
      MARI-product:
