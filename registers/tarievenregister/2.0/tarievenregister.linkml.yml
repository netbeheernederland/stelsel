id: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister
name: tarievenregister
title: Tarievenregister
version: 2.0-draft
description: Het tarievenregister legt de tarieven vast die als grondslag dienen voor leveranciers om namens systeembeheerders kosten in rekening te brengen bij aangeslotenen.
see_also:
  - er:hoofdstuk=2&afdeling=2.3&artikel=2.35&g=2026-09-02
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  rge: https://www.internetconsultatie.nl/regeling_gegevensuitwisseling_energiewet/b1
  er: https://wetten.overheid.nl/jci1.3:c:BWBR0051774&
  at: https://wetten.overheid.nl/jci1.3:c:BWBR0002448&
  tcg: https://wetten.overheid.nl/jci1.3:c:BWBR0052341&
  tce: https://wetten.overheid.nl/jci1.3:c:BWBR0052321&
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst
annotations:
  changes: |
    - Volledige herziening naar aanleiding van tijdsafhankelijke transporttarieven.

classes:
  Gewogen tariefhoogte:
    class_uri: Gewogen-tariefhoogte
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: met een wegingsfactor vermenigvuldigde tariefhoogte
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      waarde:
        description: hoeveelheid eenheden
        required: true
        range: Decimaal getal
      # relaties:
      gewogen met:
        range: Wegingsfactor
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      weging van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - gewogen met
          - weging van
  Systeemtarief:
    class_uri: Systeemtarief
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: vastgesteld bedrag per eenheid voor een dienst van de systeembeheerder
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      EAN-code:
        description: unieke cijfercombinatie volgens de Europese Artikelnummer-standaard
        required: true
        range: Code
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        comments:
          - Verplicht bij alle tariefsoorten behalve `VA-TA`.
        range: Decimaal getal
      # relaties:
      ingedeeld naar:
        range: Systeemtariefcategorie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktparijregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - EAN-code
  Systeemtariefcategorie:
    class_uri: Systeemtariefcategorie
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: verzameling systeemtarieven met dezelfde eigenschappen
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      eenheid:
        description: maat waarin een grootheid numeriek kan worden uitgedrukt
        comments:
          - "`EUR/dag` bij `VO`, anders `EUR/kWh`"
        range: Eenheid
        required: true
      energiedrager:
        exact_mappings:
          - begrip:bwjrm #energiedrager
        required: true
        range: Energiedrager
      identificatie:
        description: unieke aanduiding waarmee iets binnen een gegeven context ondubbelzinnig herkenbaar is
        range: Code
        required: true
      tariefsoort:
        description: classificatie van de dienst waarvoor het tarief geldt
        required: true
        range: Systeemtariefsoort
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Tariefcomponent:
    class_uri: Tariefcomponent
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: onderdeel van een systeemtarief, gebaseerd op een intern basistarief, dienend om de uiteindelijke vergoeding te kunnen herleiden naar dat basistarief
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      soort:
        description: classificatie van de dienst waarvoor het deeltarief geldt
        range: Tariefcomponentsoort
        required: true
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        required: true
        range: Decimaal getal
      # relaties:
      deel van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - deel van
          - soort
  Transporttariefperiode:
    class_uri: Transporttariefperiode
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: aaneengesloten periode waarbinnen eenzelfde tijdsafhankelijk tarief voor transportkosten van toepassing is
    source: rge:#
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      werkdag:
        description: geeft aan of iets een dag is, niet zijnde een zaterdag, zondag of feestdag
        see_also: at:artikel=3&g=2010-10-10
        required: true
        range: Waarheidswaarde
      kalendermaand:
        description: periode van de eerste tot en met de laatste dag van een maand, aangeduid met een getal van 1 tot 12 (januari tot december)
        required: true
        range: Code
      kalenderuur:
        description: periode van 60 minuten die begint op het hele uur, aangeduid met een getal van 0 tot 23
        required: true
        range: Code
      # relaties:
      geldigheid van:
        range: Wegingsfactor
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - geldigheid van
  Wegingsfactor:
    class_uri: Wegingsfactor
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: relatief gewicht van een tarief
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      categorie:
        description: identificatie van een wegingsfactor, aangeduid met een getal van 1 tot 5
        required: true
        range: Code
      waarde:
        description: hoeveelheid waarmee vermenigvuldigd moet worden
        required: true
        range: Decimaal getal
    unique_keys:
      identificatie:
        unique_key_slots:
          - categorie

  # verwijzingen naar externe entiteiten:
  Marktparijregistratie:
    class_uri: marktpartijenregister:Marktparijregistratie
    annotations:
      external_registry: Marktpartijenregister

enums:
  Eenheid:
    permissible_values:
      EUR/dag:
      EUR/kWh:
  Energiedrager:
    permissible_values:
      elektriciteit:
      gas:
      waterstof:
  Tariefcomponentsoort:
    permissible_values:
      PAV:
        description: periodieke aansluitvergoeding
      TAVT:
        description: transportonafhankelijk transporttarief
        comments:
          - Geldt niet voor elektriciteit.
      TOVT:
        description: transportonafhankelijk transporttarief
      MT:
        description: meettarief
  Systeemtariefsoort:
    permissible_values:
      VO:
        description: verbruiksonafhankelijk systeemtarief
      VA-TA:
        description: verbruiksafhankelijk tijdsafhankelijk transporttarief
      VA-NTA:
        description: verbruiksafhankelijk niet-tijdsafhankelijk transporttarief
