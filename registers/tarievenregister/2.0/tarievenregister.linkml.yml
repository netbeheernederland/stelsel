id: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister
name: tarievenregister
title: Tarievenregister
version: 2.0-draft
description: Het tarievenregister legt de tarieven vast die als grondslag dienen voor leveranciers om namens systeembeheerders kosten in rekening te brengen bij aangeslotenen.
see_also:
  - er:hoofdstuk=2&afdeling=2.3&artikel=2.35&g=2026-09-02
  - tce:g=2026-07-09
  - tcg:g=2026-05-28
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  er: https://wetten.overheid.nl/jci1.3:c:BWBR0051774&
  at: https://wetten.overheid.nl/jci1.3:c:BWBR0002448&
  tcg: https://wetten.overheid.nl/jci1.3:c:BWBR0052341&
  tce: https://wetten.overheid.nl/jci1.3:c:BWBR0052321&
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst
annotations:
  changes: |
    - Volledige herziening naar aanleiding van tijdsafhankelijke transporttarieven.

classes:
  Gewogen tariefhoogte:
    class_uri: Gewogen-tariefhoogte
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: met een wegingsfactor vermenigvuldigde tariefhoogte
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      waarde:
        description: hoeveelheid eenheden
        required: true
        range: Decimaal getal
      # relaties:
      gewogen met:
        range: Wegingsfactor
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      weging van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - gewogen met
          - weging van
  Systeemtarief:
    class_uri: Systeemtarief
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: vastgesteld bedrag per eenheid voor een dienst van de systeembeheerder
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      EAN-code:
        description: unieke cijfercombinatie volgens de Europese Artikelnummer-standaard
        required: true
        range: Code
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        comments:
          - Verplicht bij alle tariefsoorten behalve `VA-TA`.
        range: Decimaal getal
      # relaties:
      ingedeeld naar:
        range: Systeemtariefcategorie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktparijregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - EAN-code
  Systeemtariefcategorie:
    class_uri: Systeemtariefcategorie
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: verzameling systeemtarieven met dezelfde eigenschappen
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      eenheid:
        description: maat waarin een grootheid numeriek kan worden uitgedrukt
        comments:
          - "`EUR/dag` bij `VO`, anders `EUR/kWh`"
        range: Eenheid
        required: true
      energiedrager:
        exact_mappings:
          - begrip:bwjrm #energiedrager
        required: true
        range: Energiedrager
      identificatie:
        description: unieke aanduiding waarmee iets binnen een gegeven context ondubbelzinnig herkenbaar is
        range: Code
        required: true
      tariefsoort:
        description: classificatie van de dienst waarvoor het tarief geldt
        required: true
        range: Systeemtariefsoort
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Tariefcomponent:
    class_uri: Tariefcomponent
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: deeltarief binnen een samengesteld systeemtarief dat is gebaseerd op één elementair tarief
    comments:
      - Een tariefcomponent deelt dezelfde tariefsoort (zoals `PAV` of `MT`) met het onderliggende elementaire tarief (het interne basistarief van de netbeheerder).
      - De tariefhoogte van de component is gelijk aan het elementaire tarief vermenigvuldigd met het aantal aanwezige eenheden op de aansluiting (aantal overdrachtspunten, meetinrichtingen, etc.).
      - Door de tariefhoogte van de component te delen door het systeemtarief, wordt het aandeel van deze specifieke tariefsoort in de totale vergoeding verkregen.
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      soort:
        description: classificatie van de dienst waarvoor het deeltarief geldt
        range: Tariefcomponentsoort
        required: true
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        required: true
        range: Decimaal getal
      # relaties:
      deel van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - deel van
          - soort
  Transporttariefperiode:
    class_uri: Transporttariefperiode
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: aaneengesloten periode waarbinnen eenzelfde tijdsafhankelijk tarief voor transportkosten van toepassing is
    source: rge:#
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      aanvangsuur:
        description: heel uur van de dag waarop een periode van 60 minuten begint
        comments:
          - Representatie volgt ISO 8601 met waarden 0 tot en met 23 (lokale tijd).
        required: true
        range: Geheel getal
      kalendermaand:
        description: periode die loopt van de eerste tot en met de laatste dag van een van de twaalf maanden van een kalenderjaar
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
        required: true
        range: Geheel getal
      werkdag:
        description: dag, niet zijnde een zaterdag of een zondag en niet zijnde een algemeen erkende feestdag als bedoeld in artikel 3, eerste lid, van de Algemene Termijnenwet, noch een in het tweede of krachtens het derde lid van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag
        see_also: at:artikel=3&g=2010-10-10
        required: true
        range: Waarheidswaarde
      # relaties:
      geldigheid van:
        range: Wegingsfactor
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - geldigheid van
  Wegingsfactor:
    class_uri: Wegingsfactor
    broad_mappings:
      - begrip:gnhiy #aansluiting
    description: relatief gewicht van een tarief
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      categorie:
        description: identificatie van een wegingsfactor
        required: true
        range: Code
      waarde:
        description: hoeveelheid waarmee vermenigvuldigd moet worden
        required: true
        range: Decimaal getal
    unique_keys:
      identificatie:
        unique_key_slots:
          - categorie

  # verwijzingen naar externe entiteiten:
  Marktparijregistratie:
    class_uri: marktpartijenregister:Marktparijregistratie
    annotations:
      external_registry: Marktpartijenregister

enums:
  Eenheid:
    permissible_values:
      EUR/dag:
      EUR/kWh:
  Energiedrager:
    permissible_values:
      elektriciteit:
      gas:
      waterstof:
  Tariefcomponentsoort:
    permissible_values:
      PAV:
        description: periodieke aansluitvergoeding
      TAVT:
        description: transportafhankelijk transporttarief
        comments:
          - Geldt niet voor elektriciteit.
      TOVT:
        description: transportonafhankelijk transporttarief
      MT:
        description: meettarief
  Systeemtariefsoort:
    permissible_values:
      VO:
        description: verbruiksonafhankelijk systeemtarief
      VA-TA:
        description: verbruiksafhankelijk tijdsafhankelijk transporttarief
      VA-NTA:
        description: verbruiksafhankelijk niet-tijdsafhankelijk transporttarief
