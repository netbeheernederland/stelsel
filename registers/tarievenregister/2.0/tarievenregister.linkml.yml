id: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister
name: tarievenregister
title: Tarievenregister
version: 2.0-draft
description: Het tarievenregister legt de tarieven vast die als grondslag dienen voor leveranciers om namens systeembeheerders kosten in rekening te brengen bij aangeslotenen.
comments:
  - "Te verwerken in legenda en uitleg over tijdlijnen: een kloksymbool op een relatie betekent een verwijzing naar een bepaalde versie in de tijd."
  - |
    Vragen aan domeinexperts die tijdens de volgende sessie worden toegelicht:
    - Zullen we `verbruiksonafhankelijk systeemtarief` veranderen in `verbruiksonafhankelijk periodiek systeemtarief` om de tarieven voor de eenmalige aansluitvergoeding expliciet uit te sluiten?
    - Bij kleinverbruik lijkt er zowel voor gas als elektriciteit geen sprake te zijn van een `TAVT`. Klopt dat?
see_also:
  - er:hoofdstuk=2&afdeling=2.3&artikel=2.35&g=2026-09-02
  - tce:g=2026-07-09
  - tcg:g=2026-05-28
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/tarievenregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  er: https://wetten.overheid.nl/jci1.3:c:BWBR0051774&
  at: https://wetten.overheid.nl/jci1.3:c:BWBR0002448&
  tcg: https://wetten.overheid.nl/jci1.3:c:BWBR0052341&
  tce: https://wetten.overheid.nl/jci1.3:c:BWBR0052321&
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst
annotations:
  changes: |
    - Volledige herziening naar aanleiding van tijdsafhankelijke transporttarieven.

classes:
  Gewogen tariefhoogte:
    class_uri: Gewogen-tariefhoogte
    broad_mappings:
      - begrip:cyq9r #systeemtarief
    description: met een wegingsfactor vermenigvuldigde tariefhoogte
    attributes:
      waarde:
        description: hoeveelheid eenheden
        required: true
        range: Decimaal getal
      # relaties:
      gewogen met:
        comments:
          - De `Tariefcategorie` van de `Wegingsfactor` moet gelijk zijn aan die van het gerelateerde `Systeemtarief`.
        range: Wegingsfactor
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - gewogen met
          - van
  Systeemtarief:
    class_uri: Systeemtarief
    exact_mappings:
      - begrip:cyq9r #systeemtarief
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      EAN-code:
        description: unieke cijfercombinatie volgens de Europese Artikelnummer-standaard
        required: true
        range: Code
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        comments:
          - Verplicht bij alle tariefsoorten behalve `VA-TA`.
        range: Decimaal getal
      # relaties:
      ingedeeld naar:
        range: Tariefcategorie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktparijregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - EAN-code
  Tariefcategorie:
    class_uri: Tariefcategorie
    related_mappings:
      - begrip:cyq9r #systeemtarief
    description: verzameling tarieven met dezelfde eigenschappen
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      eenheid:
        description: maat waarin een grootheid numeriek kan worden uitgedrukt
        comments:
          - "`EUR/dag` bij `VO`, anders `EUR/kWh`"
        range: Eenheid
        required: true
      energiedrager:
        exact_mappings:
          - begrip:bwjrm #energiedrager
        required: true
        range: Energiedrager
      identificatie:
        description: unieke aanduiding waarmee iets binnen een gegeven context ondubbelzinnig herkenbaar is
        range: Code
        required: true
      tariefsoort:
        description: classificatie van de dienst waarvoor het tarief geldt
        required: true
        range: Systeemtariefsoort
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Tariefcomponent:
    class_uri: Tariefcomponent
    broad_mappings:
      - begrip:cyq9r #systeemtarief
    description: deeltarief binnen een samengesteld systeemtarief dat is gebaseerd op één elementair tarief
    comments:
      - Een tariefcomponent deelt dezelfde tariefsoort (zoals `PAV` of `MT`) met het onderliggende elementaire tarief (het interne basistarief van de netbeheerder).
      - De tariefhoogte van de component is gelijk aan het elementaire tarief vermenigvuldigd met het aantal aanwezige eenheden op de aansluiting (aantal overdrachtspunten, meetinrichtingen, etc.).
      - Door de tariefhoogte van de component te delen door het systeemtarief, wordt het aandeel van deze specifieke tariefsoort in de totale vergoeding verkregen.
    attributes:
      soort:
        description: classificatie van de dienst waarvoor het deeltarief geldt
        range: Tariefcomponentsoort
        required: true
      tariefhoogte:
        description: numerieke monetaire omvang per rekeneenheid
        required: true
        range: Decimaal getal
      # relaties:
      deel van:
        range: Systeemtarief
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - deel van
          - soort
  Transporttariefperiode:
    class_uri: Transporttariefperiode
    exact_mappings:
      - begrip:t2df3 #transporttariefperiode
    attributes:
      beginmaand:
        description: eerste kalendermaand waarop iets geldt
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
        required: true
        range: Geheel getal
      eindmaand:
        description: laatste kalendermaand waarop iets geldt
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
          - Indien `eindmaand` kleiner is dan `beginmaand` (bijv. 2 en 12), overspant de periode de jaarwisseling.
        required: true
        range: Geheel getal
      begintijd:
        description: eerste moment van de dag waarop iets geldt
        required: true
        range: Kloktijd
      eindtijd:
        description: eerste moment van de dag waarop iets niet meer geldt
        required: true
        range: Kloktijd
      werkdagen:
        description: geeft aan of de periode enkel geldt voor dagen, niet zijnde een zaterdag of een zondag en niet zijnde een algemeen erkende feestdag als bedoeld in artikel 3, eerste lid, van de Algemene Termijnenwet, noch een in het tweede of krachtens het derde lid van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag
        see_also: at:artikel=3&g=2010-10-10
        required: true
        range: Waarheidswaarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmaand
          - begintijd
          - eindmaand
          - eindtijd
          - werkdagen
  Wegingsfactor:
    class_uri: Wegingsfactor
    broad_mappings:
      - begrip:t2df3 #transporttariefperiode
    description: relatief gewicht van een tarief
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    attributes:
      categorie:
        description: identificatie van een wegingsfactor
        required: true
        range: Code
      waarde:
        description: hoeveelheid waarmee vermenigvuldigd moet worden
        required: true
        range: Decimaal getal
      # relaties:
      in:
        range: Transporttariefperiode
        required: false
        multivalued: true
        annotations:
          inverse_cardinality: "1..*"
      voor:
        range: Tariefcategorie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - categorie
          - voor

  # verwijzingen naar externe entiteiten:
  Marktparijregistratie:
    class_uri: marktpartijenregister:Marktparijregistratie
    annotations:
      external_registry: Marktpartijenregister

enums:
  Eenheid:
    permissible_values:
      EUR/dag:
      EUR/kWh:
  Energiedrager:
    permissible_values:
      elektriciteit:
      gas:
      waterstof:
  Tariefcomponentsoort:
    permissible_values:
      PAV:
        meaning: begrip:z37a3 #periodieke aansluitvergoeding
      TOVT:
        meaning: begrip:jm8kj #transportonafhankelijk transporttarief
      MT:
        meaning: begrip:ee4qa #meettarief
  Systeemtariefsoort:
    permissible_values:
      VO:
        meaning: begrip:jn6a3 #verbruiksonafhankelijk periodiek systeemtarief
      VA-TA:
        meaning: begrip:7jthh #verbruiksafhankelijk tijdsafhankelijk transporttarief
      VA-NTA:
        meaning: begrip:3twby #verbruiksafhankelijk niet-tijdsafhankelijk transporttarief
