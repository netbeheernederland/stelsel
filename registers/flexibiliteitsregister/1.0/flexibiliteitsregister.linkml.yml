id: https://modellen.netbeheernederland.nl/stelsel/registers/flexibiliteitsregister
name: flexibiliteitsregister
title: Flexibiliteitsregister
version: 1.0-draft
description: Het flexibiliteitsregister legt vast welke capaciteit wordt ingezet en vrijgegeven om het energienet optimaal te benutten.
comments:
  - Dit model focust zich vooralsnog op congestiebeheersdiensten en transportvrijgaven. Ondersteunende diensten waaronder balanceringsdiensten volgen mogelijk later.
  - De invloed die een gewijzigde energie-uitwisseling op een bepaalde aansluiting heeft op het energietransport over een bepaald routedeel (in GOPACS bekend als de 'effectiviteitsmatrix') maakt geen deel uit van dit register.
  - "Het dagelijkse redispatchproces doorloopt de volgende stappen: `Redispatchbehoefte` (en eventueel `Redispatchrestrictie`), `Biedingsverzoek`, `Bieding redispatch`, `Redispatch`."
  - |
    Mapping op GOPACS-termen:
    - `Routedeel`: gebied, netelement
    - `Redispatchbehoefte`: probleem
    - `Redispatchrestrictie`: bescherming
    - `Systeemkoppeling`: BritNed
    - `Redispatchcapaciteit`: biedplichtcontract
    - grid connection: `Aansluiting`, `Allocatiepunt`, `Capaciteitssturingsdienst`, `Systeemkoppeling`, `Redispatchdeelname`
    - probleem: `Redispatchbehoefte`
    - marktbericht: `Biedverzoek`
    - order: `Bieding redispatch`
see_also:
  - sce:hoofdstuk=9&paragraaf=9.2&artikel=9.14&g=2026-07-01
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/flexibiliteitsregister#
  aansluitingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/aansluitingenregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  transporteenhedenregister: https://modellen.netbeheernederland.nl/stelsel/registers/transporteenhedenregister#
  sce: https://wetten.overheid.nl/jci1.3:c:BWBR0052336&
imports:
  - ../../basiswaardesoorten
default_prefix: this
default_range: Tekst

classes:
  Redispatchbehoefte:
    class_uri: Redispatchbehoefte
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: wat de systeembeheerder nodig heeft aan biedingen redispatch om een transportprobleem op te lossen
    slots:
      - begin levering
      - richting
    attributes:
      # relaties:
      op:
        range: Routedeel
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin levering
          - op
  Biedverzoek:
    class_uri: Biedverzoek
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: uitnodiging aan marktpartijen om biedingen redispatch te doen
    attributes:
      begin biedperiode:
        description: eerste tijdstip vanaf wanneer biedingen kunnen worden ingediend
        range: Tijdstip
        required: true
      einde biedperiode:
        description: eerste tijdstip vanaf wanneer biedingen niet meer kunnen worden ingediend
        range: Tijdstip
        required: true
      # relaties:
      vanwege:
        range: Redispatchbehoefte
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin biedperiode
          - vanwege
  Deelbehoefte:
    class_uri: Deelbehoefte
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: door een leveringsperiode afgebakend deel van een redispatchbehoefte
    slots:
      - begin levering
      - einde levering
    attributes:
      volume vereist:
        description: benodigde hoeveelheid energie
        range: Decimaal getal
        required: true
        unit:
          ucum_code: MWh
      # relaties:
      deel van:
        range: Redispatchbehoefte
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "1..*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin levering
          - deel van
  Redispatch:
    class_uri: Redispatch
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: verplaatsing van energietransport door de gecombineerde afroep van één of meer biedingen redispatch
    attributes:
      identificatie:
        description: unieke aanduiding van de redispatch
        required: true
      balansneutraal:
        description: geeft aan of het totale volume van de afroepen in beide richtingen gelijk is
        required: true
      # relaties:
      door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Afroep van bieding redispatch:
    class_uri: Afroep-van-bieding-redispatch
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: opdracht om de geplande energie-uitwisseling aan te passen op basis van een bieding redispatch
    slots:
      - begin levering
      - einde levering
      - volume
    attributes:
      # relaties:
      deel van:
        range: Redispatch
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "1..*"
      inzet van:
        range: Bieding redispatch
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin levering
          - deel van
          - inzet van
  Redispatchrestrictie:
    class_uri: Redispatchrestrictie
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: beperking op de inzet van redispatch
    slots:
      - beginmoment
      - eindmoment
      - richting
    attributes:
      # relaties:
      op:
        range: Routedeel
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - richting
          - op
  Bieding redispatch:
    class_uri: Bieding-redispatch
    exact_mappings:
      - begrip:zjfey #bieding redispatch
    slots:
      - begin levering
      - einde levering
      - volume
      - richting
    attributes:
      marktgebaseerd:
        description: geeft aan of de bieding is gebaseerd op een marktmechanisme
        range: Waarheidswaarde
        required: true
      prijs:
        description: overeengekomen vergoeding per eenheid energie
        range: Decimaal getal
        required: true
        unit:
          ucum_code: EUR/MWh
      partiële afroepbaarheid:
        description: fractie van het volume dat minimaal moet worden afgeroepen
        range: Decimaal getal
      handelsplatform:
        description: beheerde plaats waar vraag en aanbod bijeenkomen
        range: Code
      # relaties:
      onder:
        range: Redispatchdeelname
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin levering
          - onder
  Redispatchcapaciteit:
    class_uri: Redispatchcapaciteit
    related_mappings:
      - begrip:zjfey #bieding redispatch
    description: plicht om op verzoek biedingen redispatch te doen
    annotations:
      tijdlijn_geldigheid: true
    slots:
      - richting
    slot_usage:
      richting:
        multivalued: true
    attributes:
      identificatie:
        description: unieke aanduiding waarmee iets binnen een gegeven context ondubbelzinnig herkenbaar is
        range: Code
        required: true
      marktgebaseerd:
        description: geeft aan of marktwerking de totstandkoming bepaalt
        range: Waarheidswaarde
        required: true
      minimale transportvraag:
        description: ondergrens van de transportvraag waarbeneden geen redispatchbiedingen hoeven te worden gedaan
        comments:
          - Een negatieve waarde representeert invoeding, een positieve afname.
        required: true
        unit:
          ucum_code: MW
      maximale transportvraag:
        description: bovengrens van de transportvraag waarboven geen redispatchbiedingen hoeven te worden gedaan
        comments:
          - Een negatieve waarde representeert invoeding, een positieve afname.
        unit:
          ucum_code: MW
      variabel:
        description: geeft aan of de transportvraag in delen beschikbaar is voor het doen van biedingen redispatch
        required: true
        range: Waarheidswaarde
      stapgrootte:
        description: minimale hoeveelheid waarin de transportvraag kan worden gevarieerd
        required: true
        unit:
          ucum_code: MW
      # relaties:
      deel van:
        range: Redispatchdeelname
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Redispatchcapaciteitsperiode:
    class_uri: Redispatchcapaciteitsperiode
    description: tijdsvenster waarbinnen de redispatchcapaciteit beschikbaar is
    related_mappings:
      - begrip:zjfey #bieding redispatch
    attributes:
      beginmaand:
        description: eerste kalendermaand waarin het venster van toepassing is
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
        required: true
        range: Geheel getal
      eindmaand:
        description: laatste kalendermaand waarin het venster van toepassing is
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
          - Indien `eindmaand` kleiner is dan `beginmaand` (bijv. 2 en 12), overspant de periode de jaarwisseling.
        required: true
        range: Geheel getal
      dag van de week:
        description: elk van de zeven opeenvolgende, uniek benoemde periodes van 24 uur waaruit een vaste cyclus (de week) bestaat
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (maandag) tot en met 7 (zondag).
          - Heeft altijd betrekking op de dag waarop de `begintijd` valt.
        required: true
        multivalued: true
        range: Geheel getal
      begintijd:
        description: aanvangstijd van het venster op de geselecteerde dag(en)
        required: true
        range: Kloktijd
      eindtijd:
        description: eerste tijd waarop het venster niet meer van toepassing is
        comments:
          - Indien `eindtijd` kleiner is dan `begintijd` (bijv. van 22 tot 6 uur), dan loopt het venster door tot de volgende kalenderdag.
        required: true
        range: Kloktijd
      tijdens feestdagen:
        description: geeft aan of het venster ook van kracht is op een algemeen erkende feestdag als bedoeld in artikel 3, eerste lid, van de Algemene Termijnenwet, of een in het tweede of krachtens het derde lid van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag
        required: true
        range: Waarheidswaarde
      # relaties:
      beschikbaarheid van:
        range: Redispatchcapaciteit
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
          volgt_tijdlijn_geldigheid: true
  Redispatchdeelname:
    class_uri: Redispatchdeelname
    see_also:
      - sce:hoofdstuk=9&paragraaf=9.2&artikel=9.17&g=2026-07-01
    broad_mappings:
      - begrip:zjfey #bieding redispatch
    description: registratie van deelname aan congestiebeheer
    annotations:
      tijdlijn_geldigheid: true
    slots:
      - EAN-code
    attributes:
      # relaties:
      van:
        comments:
          - Deze relatie is afgeleid uit het marktactiviteitenregister.
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      op:
        comments:
          - Per allocatiepunt kan er maximaal één redispatchdeelname zijn.
        range: Any
        exactly_one_of:
          - range: Allocatiepunt
          - range: Systeemkoppeling
        required: true
        multivalued: true
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - EAN-code
  Capaciteitssturingsdienst:
    class_uri: Capaciteitssturingsdienst
    broad_mappings:
      - begrip:39t96 #capaciteitsdienst
    description: dienst waarbij een aangeslotene of een groep van aangeslotenen zich tegenover de systeembeheerder verplicht om voor een afgesproken periode een minimale of maximale capaciteit af te nemen of in te voeden
    source: sce:bijlage=6&g=2026-10-01
    comments:
      - Niet weergegeven zijn tarieven, de toestemming voor de operationele acceptatietest en overige afspraken.
    annotations:
      tijdlijn_geldigheid: true
    slots:
      - EAN-code
    attributes:
      grondslag voor vergoeding:
        description: soort referentiewaarde ten opzichte waarvan de daadwerkelijk gestuurde capaciteit voor financiële afrekening wordt berekend
        range: Grondslag voor vergoeding
      overeengekomen referentiecapaciteit:
        description: statische capaciteitswaarde die dient als basis om de gestuurde capaciteit te bepalen
        comments:
          - Verplicht bij als dit de gekozen `grondslag voor vergoeding` is, anders verboden.
        range: Decimaal getal
        unit:
          ucum_code: MW
      # relaties:
      op:
        comments:
          - Als later de `Aansluiting` eventueel wordt gesplitst in `Aansluitrecht` en `Transportrecht` (vanwege de groepstransportovereenkomst), dan hoort deze relatie naar `Transportrecht` te gaan.
        range: Aansluiting
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - EAN-code
  Wijze van activering:
    class_uri: Wijze-van-activering
    broad_mappings:
      - begrip:39t96 #capaciteitsdienst
    description: vastgelegde methode waarmee een capaciteitsdienst wordt geactiveerd
    attributes:
      kanaal:
        description: communicatiemethode
        range: Kanaal
        required: true
      API-parameters:
        description: benodigde gegevens voor communicatie via een programmeerinterface
        comments:
          - Verplicht bij `API`.
        range: Code
      e-mailadres:
        description: adres voor elektronische post
        comments:
          - Verplicht bij `GUI`.
        range: Code
      # relaties:
      van:
        range: Capaciteitssturingsdienst
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - van
  Capaciteitssturingsdienst bij richting:
    class_uri: Capaciteitssturingsdienst-bij-richting
    broad_mappings:
      - begrip:39t96 #capaciteitsdienst
    description: voorwaarden van de capaciteitssturingsdienst specifiek voor opregelen óf afregelen
    slots:
      - richting
    attributes:
      minimaal afroepbare capaciteit:
        description: kleinste capaciteitswijziging die kan worden afgeroepen
        range: Decimaal getal
        unit:
          ucum_code: MW
        required: true
      maximaal afroepbare capaciteit:
        description: hoogste capaciteitswijziging die kan worden afgeroepen
        range: Decimaal getal
        unit:
          ucum_code: MW
        required: true
      stapgrootte:
        description: kleinste discrete eenheid waarmee een afroep kan worden gevarieerd
        range: Decimaal getal
        unit:
          ucum_code: MW
        required: true
      maximaal volume per afroep:
        description: maximale hoeveelheid energie die gedurende één aaneengesloten afroep kan worden gestuurd
        range: Decimaal getal
        unit:
          ucum_code: MWh
      maximaal volume per dag:
        description: maximale cumulatieve hoeveelheid energie die binnen één kalenderdag over alle afroepen heen kan worden gestuurd
        range: Decimaal getal
        unit:
          ucum_code: MWh
      minimale rusttijd tussen afroepen:
        description: minimale tijd die moet verstrijken tussen het einde van een afroep en de aanvang van een opvolgende afroep
        range: Tijdsduur
        required: true
      minimale duur per afroep:
        description: minimale aaneengesloten tijd dat een geactiveerde sturing van kracht moet blijven
        range: Tijdsduur
        required: true
      maximale duur per afroep:
        description: maximale aaneengesloten tijd dat een geactiveerde sturing kan duren
        range: Tijdsduur
      maximale inzet per jaar:
        description: maximale cumulatieve tijd per kalenderjaar waarin de aangeslotene capaciteitssturing kan leveren
        range: Tijdsduur
      # relaties:
      deel van:
        range: Capaciteitssturingsdienst
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "1..2"
          volgt_tijdlijn_geldigheid: true
    unique_keys:
      identificatie:
        unique_key_slots:
          - richting
          - deel van
  Capaciteitssturingsperiode:
    class_uri: Capaciteitssturingsperiode
    broad_mappings:
      - begrip:39t96 #capaciteitsdienst
    description: tijdgebonden afspraak over capaciteitssturing
    attributes:
      leveringsregime:
        description: aard van de leveringsverplichting
        range: Leveringsregime
        required: true
      beginmaand:
        description: eerste kalendermaand waarin de afspraak van toepassing is
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
        required: true
        range: Geheel getal
      eindmaand:
        description: laatste kalendermaand waarin de afspraak van toepassing is
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (januari) tot en met 12 (december).
          - Indien `eindmaand` kleiner is dan `beginmaand` (bijv. 2 en 12), overspant de periode de jaarwisseling.
        required: true
        range: Geheel getal
      dag van de week:
        description: elk van de zeven opeenvolgende, uniek benoemde periodes van 24 uur waaruit een vaste cyclus (de week) bestaat
        comments:
          - Representatie volgt ISO 8601 met waarden 1 (maandag) tot en met 7 (zondag).
          - Heeft altijd betrekking op de dag waarop de `begintijd` valt.
        required: true
        multivalued: true
        range: Geheel getal
      begintijd:
        description: aanvangstijd van de afspraak op de geselecteerde dag(en)
        required: true
        range: Kloktijd
      eindtijd:
        description: eerste tijd waarop de afspraak niet meer van toepassing is
        comments:
          - Indien `eindtijd` kleiner is dan `begintijd` (bijv. van 22 tot 6 uur), dan loopt het venster door tot de ochtend van de volgende kalenderdag.
        required: true
        range: Kloktijd
      tijdens feestdagen:
        description: geeft aan of de afspraak ook van kracht is op een algemeen erkende feestdag als bedoeld in artikel 3, eerste lid, van de Algemene Termijnenwet, of een in het tweede of krachtens het derde lid van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag
        required: true
        range: Waarheidswaarde
      grenscapaciteit:
        description: uiterste capaciteit tot waar de systeembeheerder kan sturen (op afroep) dan wel die de aangeslotene niet mag overschrijden (vast)
        comments:
          - Een positieve waarde representeert afname, een negatieve invoeding.
          - "Bij `op afroep` geldt: bij `afregelen` kan de systeembeheerder niet boven deze waarde sturen, bij `opregelen` niet onder deze waarde."
          - "Bij `vast` geldt: bij `afregelen` moet de aangeslotene boven deze waarde blijven, bij `opregelen` eronder."
        range: Decimaal getal
        unit:
          ucum_code: MW
      # relaties:
      deel van:
        range: Capaciteitssturingsdienst bij richting
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
          volgt_tijdlijn_geldigheid: true
  Afroep van variabele capaciteitssturing:
    class_uri: Afroep-van-variabele-capaciteitssturing
    broad_mappings:
      - begrip:39t96 #capaciteitsdienst
    description: opdracht om tijdelijk een overeengekomen transportcapaciteit toe te passen
    slots:
      - begin levering
      - einde levering
    attributes:
      bovengrens:
        description: maximaal toegestane capaciteit
        comments:
          - Een positieve waarde representeert afname, een negatieve invoeding.
        range: Decimaal getal
        unit:
          ucum_code: MW
      ondergrens:
        description: minimaal toegestane capaciteit
        comments:
          - Een positieve waarde representeert afname, een negatieve invoeding.
        range: Decimaal getal
        unit:
          ucum_code: MW
      # relaties:
      van:
        range: Capaciteitssturingsdienst bij richting
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - begin levering
          - van
          - door
  Transportvrijgave:
    class_uri: Transportvrijgave
    exact_mappings:
      - begrip:e8frg #transportvrijgave
    slots:
      - beginmoment
      - eindmoment
    attributes:
      bovengrens:
        description: maximaal toegestane capaciteit
        comments:
          - Een positieve waarde representeert afname, een negatieve invoeding.
        range: Decimaal getal
        unit:
          ucum_code: MW
      ondergrens:
        description: minimaal toegestane capaciteit
        comments:
          - Een positieve waarde representeert afname, een negatieve invoeding.
        range: Decimaal getal
        unit:
          ucum_code: MW
      # relaties:
      op:
        range: Aansluiting
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - op
  Wijze van vrijgave:
    class_uri: Wijze-van-vrijgave
    broad_mappings:
      - begrip:e8frg #transportvrijgave
    description: methode om de transportdienst vrij te geven op een aansluiting
    attributes:
      kanaal:
        description: communicatiemethode
        range: Kanaal
        required: true
      API-parameters:
        description: benodigde gegevens voor communicatie via een programmeerinterface
        comments:
          - Verplicht bij `API`.
        range: Code
      e-mailadres:
        description: adres voor elektronische post
        comments:
          - Verplicht bij `GUI`.
        range: Code
      # relaties:
      op:
        range: Aansluiting
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - op

  # verwijzingen naar externe entiteiten:
  Any:
    class_uri: linkml:Any
  Aansluiting:
    class_uri: aansluitingenregister:Aansluiting
    annotations:
      external_registry: Aansluitingenregister
  Allocatiepunt:
    class_uri: aansluitingenregister:Allocatiepunt
