slots:
  EAN-code:
    description: unieke cijfercombinatie volgens de Europese Artikelnummer-standaard
    required: true
    range: Code
  beginmoment:
    description: eerste moment waarop iets geldt
    range: Tijdstip
    required: true
  eindmoment:
    description: eerste moment waarop iets niet meer geldt
    range: Tijdstip
    required: true
  begin levering:
    description: eerste moment van een leveringsperiode
    required: true
    range: Tijdstip
  einde levering:
    description: laatste moment van een leveringsperiode
    required: true
    range: Tijdstip
  richting:
    description: oriëntatie van het energietransport
    required: true
    range: Sturingsrichting
  volume:
    description: hoeveelheid energie (het gaat hier niet om een gemeten maar een toegezegd volume, vandaar als decimaal getal)
    range: Decimaal getal
    unit:
      ucum_code: MWh

enums:
  Grondslag voor vergoeding:
    permissible_values:
      gecontracteerde transportcapaciteit voor afname:
      gecontracteerde transportcapaciteit voor invoeding:
      overeengekomen referentiecapaciteit:
      theoretische capaciteit per onbalansverrekeningsperiode:
  Kanaal:
    permissible_values:
      API:
        description: via een webservice (voor systemen)
      GUI:
        description: via een gebruikersinterface (voor mensen)
  Leveringsregime:
    permissible_values:
      op afroep:
        description: activatie op afroep
      vast:
        description: activatie zonder afroep
  Sturingsrichting:
    permissible_values:
      opregelen:
        description: meer invoeden of minder afnemen
      afregelen:
        description: minder invoeden of meer afnemen
