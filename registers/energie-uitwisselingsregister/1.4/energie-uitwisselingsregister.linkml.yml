id: https://modellen.netbeheernederland.nl/stelsel/registers/energie-uitwisselingsregister
name: energie-uitwisselingsregister
title: Energie-uitwisselingsregister
version: "1.4"
description: Het energie-uitwisselingsregister legt de bemeten energie-uitwisseling met een energienet vast, evenals de parameters waarmee de onbemeten energie-uitwisseling kan worden bepaald.
comments:
  - De volumes voor onbemeten energie-uitwisseling worden bewust niet in dit register vastgelegd. Deze volumes worden namelijk voor een specifiek doel (zoals alloceren of factureren) afzonderlijk berekend, met een bij dat doel passend vaststellingsmoment en granulariteit.
  - "Met het oog op doelbinding en de bescherming van persoonsgegevens, onderscheiden we uitgewisselde volumes naar hun resolutiecategorie: `interval` (met hoge resolutie, zoals kwartier- of uurwaarden) en `periodiek` (met lage resolutie, zoals maand- of jaarvolumes)."
see_also:
  - iceg:g=2025-01-01
  - rge:#
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/energie-uitwisselingsregister#
  aansluitingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/aansluitingenregister#
  installatieregister: https://modellen.netbeheernederland.nl/stelsel/registers/installatieregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  meetinrichtingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/meetinrichtingenregister#
  asg: https://wetten.overheid.nl/jci1.3:c:BWBR0052342&
  bce: https://wetten.overheid.nl/jci1.3:c:BWBR0037938&
  bce2026: https://wetten.overheid.nl/jci1.3:c:BWBR0052320&
  bcg2026: https://wetten.overheid.nl/jci1.3:c:BWBR0052329&
  iceg: https://wetten.overheid.nl/jci1.3:c:BWBR0037934&
  mcg: https://wetten.overheid.nl/jci1.3:c:BWBR0037925&
  rge: https://www.internetconsultatie.nl/regeling_gegevensuitwisseling_energiewet/b1
  rgvo: https://wetten.overheid.nl/jci1.3:c:BWBR0035971&
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst
annotations:
  changes: |
    - `Dispuut` en `Alternatieve meterstand` toegevoegd (ontbrak).
    - `Jaarverbruik telemetrieverbruikers` toegevoegd (ontbrak).
    - `profielcategorie` bij gas --> `aansluitingcategorie` (nieuwe regelgeving).
    - `profielcategorie` bij elektriciteit --> `profielcategoriecode` (nieuwe regelgeving, vormt samen met `vastgesteld afnametype` de profielcategorie).
    - `Allocatiepunt bij aansluiting` vervangen door `Allocatiepunt` (zodat naast aansluitingen ook systeemgebieden meedoen).
    - `Tellerstand` --> `Meterstand` (voorkeursterm in regelgeving).
    - `gereconcilieerd` verwijderd (hoort thuis in het reconciliatieproces).
    - `kWmax` --> `Piekbelasting` (energiedrageragnostische terminologie)
    - `resolutie` toegevoegd aan `Uitgewisseld volume` (ontbrak), daarom tevens `interval` op `Piekbelasting` gewijzigd naar `resolutie`.
    - ISO 3610-tijdlijnen correct toegepast (geen `tijdlijn geldigheid` bij perduranten/gebeurtenissen).
    - `Uitgewisseld volume` relateert niet langer aan GvO-installatie (was een vergissing).
    - `eindmoment` is deel van de identificatie bij gebeurtenissen die elkaar in principe kunnen overlappen (`Uitgewisseld volume`, `Restvolume`, `Piekbelasting`, `Productievolume`).
    - `bepalingsmethode` toegevoegd aan dynamische profielfracties (ontbrak).
    - `Verwachte opwekking` verwijderd (moet worden gezien als een verzoek aan het register, niet een uit te leveren registergegeven).
    - `Opgewekt volume` --> `Productievolume` (beter herkenbaar).
    - `eenheid` vervangen door `meetsoort` (voor een meer expliciete betekenis).

classes:
  Actuele temperatuurcoëfficiënt:
    class_uri: Actuele-temperatuurcoefficient
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: etmaalgemiddelde effectieve temperatuur, berekend op basis van de gemiddelde temperatuur en windsnelheid, die wordt gebruikt voor gasallocatieprocessen
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
  Alternatieve meterstand:
    class_uri: Alternatieve-meterstand
    is_a: Meterstand
    description: in een dispuut door de wederpartij aangedragen vervangende meterstand
    attributes:
      # relaties:
      aangedragen in:
        range: Dispuut
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "1..*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - aangedragen in
          - moment
          - van
  Calorische omrekenfactor:
    class_uri: Calorische-omrekenfactor
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: maandgemiddelde correctiefactor die de hoeveelheid verbruikt gas (in m3) omzet naar energie (m3(n;35;17)), op basis van de calorische waarde van het gas in een specifiek systeemgebied
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    attributes:
      # relaties:
      in:
        range: Systeemgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - in
  Dispuut:
    class_uri: Dispuut
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: formele betwisting van de juistheid van een vastgestelde meterstand
    comments:
      - De partij die de originele meterstand heeft vastgesteld heet de 'initiërende partij'. De partij die een dispuutmelding indient, heet de 'wederpartij'.
    annotations:
      tijdlijn_registratie: true
    slots:
      - herkomstindicatie
    attributes:
      identificatie:
        description: unieke aanduiding waarmee iets binnen een gegeven context ondubbelzinnig herkenbaar is
        range: Code
        required: true
      referentie:
        description: kenmerk van het dispuut bij de wederpartij
        range: Code
      toelichting:
        description: onderbouwing van de betwisting door de wederpartij
      resultaat:
        description: formele uitkomst van de beoordeling door de initiërende partij
        range: Resultaat
      toelichting op resultaat:
        description: onderbouwing van het besluit door de initiërende partij
      # relaties:
      gericht tegen:
        description: geeft aan wie de 'initiërende partij' is in het dispuutproces
        comments:
          - Dit is niet altijd de partij die de meterstand heeft vastgesteld.
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      ingediend door:
        description: geeft aan wie de 'wederpartij' is in het dispuutproces
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      over:
        range: Vastgestelde meterstand
        required: true
        multivalued: true
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - identificatie
  Dynamische profielfractie elektriciteit:
    class_uri: Dynamische-profielfractie-elektriciteit
    is_a: Profielfractie
    description: per systeemgebied vastgestelde quotiënt van uitgewisselde elektriciteit in een onbalansverrekeningsperiode en uitgewisselde elektriciteit in het bijbehorende kalenderjaar
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - profielcategoriecode
      - vastgesteld afnametype
      - waarde
    attributes:
      bepalingsmethode:
        description: manier waarop de waarde van de profielfractie is bepaald
        range: Bepalingsmethode
        required: true
      # relaties:
      in:
        range: Systeemgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - energierichting
          - in
          - profielcategoriecode
          - vastgesteld afnametype
  Jaarverbruik telemetrieverbruikers:
    class_uri: Jaarverbruik-telemetrieverbruikers
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: werkelijk gemeten gasafname in m3(n;35,17) in de meest recente 12 volledige gasmaanden voor telemetrieverbruikers
    source: bcg2026:g=2026-02-21
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    slots:
      - waarde
    attributes:
      # relaties:
      op:
        range: Allocatiepunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - op
  Gewogen gemiddelde calorische waarde:
    class_uri: Gewogen-gemiddelde-calorische-waarde
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: per systeemgebied gewogen gemiddelde hoeveelheid energie die vrijkomt bij verbranding per eenheid van volume
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    attributes:
      # relaties:
      in:
        range: Systeemgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - in
  Meterstand:
    class_uri: Meterstand
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: stand van een specifiek telwerk op een bepaald moment
    slots:
      - herkomstindicatie
      - meetsoort
      - waarde
    annotations:
      tijdlijn_registratie: true
    attributes:
      moment:
        description: tijdstip
        range: Tijdstip
        required: true
      # relaties:
      van:
        range: Telwerk
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - moment
          - van
  Piekbelasting:
    class_uri: Piekbelasting
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: werkelijk voorgekomen maximale belasting van het net door een aangeslotene op een netaansluiting
    comments:
      - Bij elektriciteit bekend als kWmax.
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - meetsoort
      - resolutie
      - waarde
    attributes:
      # relaties:
      op:
        range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - energierichting
          - meetsoort
          - op
  Productievolume:
    class_uri: Productievolume
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: energie opgewekt in een installatie van een aangeslotene
    source: rgvo:g=2026-09-02
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - netlevering
      - waarde
    attributes:
      # relaties:
      opgewekt in:
        range: GvO-installatie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - netlevering
          - opgewekt in
  Profielfractie:
    class_uri: Profielfractie
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: relatief deel van uitgewisseld volume in een kalenderjaar
    annotations:
      tijdlijn_registratie: true
  Profielfractie gas:
    class_uri: Profielfractie-gas
    is_a: Profielfractie
    description: quotiënt van uitgewisseld gas in een uur en uitgewisseld gas in het bijbehorende kalenderjaar, niet gecorrigeerd voor temperatuur
    see_also:
      - iceg:bijlage=3&g=2025-01-01
    slots:
      - beginmoment
      - eindmoment
      - aansluitingcategorie
    attributes:
      regressiecoëfficiënt:
        description: fractie van een (jaar)verbruik dat het temperatuurafhankelijke verbruik per graad Celsius van het desbetreffende uur weergeeft
        comments:
          - In graden Celcius per uur, met 8 decimalen.
        range: Decimaal getal
        required: true
      stooktemperatuur:
        description: temperatuur waarboven geen temperatuurafhankelijk verbruik is
        comments:
          - In graden Celcius per uur, met 4 decimalen.
        range: Decimaal getal
        required: true
      temperatuuronafhankelijke deel:
        description: fractie van een (jaar)verbruik dat het temperatuuronafhankelijke verbruik van het desbetreffende uur weergeeft
        comments:
          - Getal met 8 decimalen.
        range: Decimaal getal
        required: true
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - aansluitingcategorie
  Restvolume:
    class_uri: Restvolume
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: verschil tussen een cumulatief gemeten volume en de som van de onderliggende deelvolumes over dezelfde periode
    comments:
      - Niet te verwarren met restantvolume.
    see_also:
      - mcg:hoofdstuk=5&paragraaf=5.2&artikel=5.2.3&g=2025-05-08
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - meetsoort
      - waarde
    attributes:
      # relaties:
      op:
        range: Any
        exactly_one_of:
          - range: Allocatiepunt
          - range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - energierichting
          - meetsoort
          - op
  Standaard profielfractie elektriciteit:
    class_uri: Standaard-profielfractie-elektriciteit
    is_a: Profielfractie
    description: verwachte energie-uitwisseling op een allocatiepunt bij gestandaardiseerde condities en op basis van een genormaliseerd jaar
    see_also:
      - bce2026:g=2026-07-09
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - profielcategoriecode
      - vastgesteld afnametype
      - waarde
    slot_usage:
      vastgesteld afnametype:
        required: false
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - energierichting
          - profielcategoriecode
          - vastgesteld afnametype
  Standaardjaarvolume:
    class_uri: Standaardjaarvolume
    exact_mappings:
      - begrip:y4yex #standaardjaarvolume
    comments:
      - Ook wel bekend als standaardjaarafname (SJA) elektriciteit, standaardjaarinvoeding (SJI) elektriciteit, standaardjaarverbruik (SJV) gas of jaarverbruik gas.
      - Niet te verwarren met jaarverbruik telemetrieverbruikers.
    see_also:
      - iceg:hoofdstuk=2&paragraaf=2.1&artikel=2.1.3&g=2025-01-01
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    slots:
      - energierichting
      - tariefperiode
      - waarde
    attributes:
      # relaties:
      op:
        range: Allocatiepunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - energierichting
          - op
          - tariefperiode
  Temperatuur gecorrigeerde profielfractie gas:
    class_uri: Temperatuur-gecorrigeerde-profielfractie-gas
    is_a: Profielfractie
    description: quotiënt van uitgewisseld gas in een uur en uitgewisseld gas in het bijbehorende kalenderjaar, gecorrigeerd voor temperatuur
    see_also:
      - iceg:hoofdstuk=2&paragraaf=2.4&artikel=2.4.2&g=2025-01-01
    slots:
      - beginmoment
      - eindmoment
      - aansluitingcategorie
      - waarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - aansluitingcategorie
  Uitgewisseld volume:
    class_uri: Uitgewisseld-volume
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: hoeveelheid of kwaliteit van energie, uitgewisseld met een energienet
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - herkomstindicatie
      - meetsoort
      - resolutie
      - tariefperiode
      - waarde
    attributes:
      reparatiemethodiek:
        description: wijze waarop de waarde is gecorrigeerd of berekend
        source: bce:g=2025-12-20
        range: Reparatiemethodiek
      resolutiecategorie:
        description: classificatie van resoluties
        comments:
          - Afleidbaar van de resolutie.
        range: Resolutiecategorie
      validatiestatus:
        description: resultaat van de validatie van de waarde
        source: bce2026:g=2026-07-09
        range: Validatiestatus
      # relaties:
      op:
        range: Any
        exactly_one_of:
          - range: Allocatiepunt
          - range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - energierichting
          - meetsoort
          - op
          - resolutie
          - tariefperiode
  Vastgestelde meterstand:
    class_uri: Vastgestelde-meterstand
    is_a: Meterstand
    description: officieel bevestigde meterstand
    attributes:
      # relaties:
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - moment
          - van

  # externe entiteiten:
  Allocatiepunt:
    class_uri: aansluitingenregister:Allocatiepunt
    annotations:
      external_registry: Aansluitingenregister
  Any:
    class_uri: linkml:Any
  GvO-installatie:
    class_uri: installatieregister:GvO-installatie
    annotations:
      external_registry: Installatieregister
  Marktpartijsubregistratie:
    class_uri: marktpartijenregister:Marktpartijsubregistratie
    annotations:
      external_registry: Marktpartijenregister
  Meetinrichtingenregister:
    class_uri: meetinrichtingenregister:Telwerk
    annotations:
      external_registry: Meetinrichtingenregister
  Systeemgebied:
    class_uri: aansluitingenregister:Systeemgebied
    annotations:
      external_registry: Aansluitingenregister
  Overdrachtspunt:
    class_uri: aansluitingenregister:Overdrachtspunt
    annotations:
      external_registry: Aansluitingenregister

slots:
  aansluitingcategorie:
    description: classificering van allocatiepunten bij gasaansluitingen op grond van objectief vast te stellen kenmerken, zoals in de Allocatiecode systeembeheerders gas nader vastgesteld
    source: bcg2026:g=2026-02-21
    comments:
      - Voorheen `profielcategorie`.
    range: Aansluitingcategorie
    required: true
  beginmoment:
    description: eerste tijdstip waarop iets geldt
    range: Tijdstip
    required: true
  eindmoment:
    description: eerste tijdstip waarop iets niet meer geldt
    range: Tijdstip
    required: true
  energierichting:
    exact_mappings:
      - begrip:yn3hb #energierichting
    range: Energierichting
    required: true
  herkomstindicatie:
    description: oorsprong van een waarde
    source: bce2026:g=2026-07-09
    range: Herkomstindicatie
    required: true
  meetsoort:
    description: vorm waarin energie-uitwisseling wordt gekwantificeerd
    range: Meetsoort
    required: true
  netlevering:
    description: geeft aan of het volume is ingevoed op het energienet
    range: boolean
    required: true
  profielcategoriecode:
    description: classificering van allocatiepunten bij elektriciteitsaansluitingen op grond van objectief vast te stellen kenmerken, exclusief het vastgesteld afnametype
    comments:
      - De combinatie van `profielcategoriecode` en `vastgesteld afnametype` identificeert een profielcategorie.
    range: Profielcategoriecode
    required: true
  resolutie:
    description: voorgenomen tijdsduur tussen beginmoment en eindmoment
    range: Resolutie
  tariefperiode:
    description: aaneengesloten periode van normaaluren of laaguren
    comments:
      - Van toepassing op elektriciteit bij tijdsperioden langer dan een dag.
    range: Tariefperiode
  vastgesteld afnametype:
    description: bepaling of op een allocatiepunt sprake is van afname met invoeding of afname zonder invoeding
    range: Vastgesteld afnametype
    required: true
  waarde:
    description: hoeveelheid eenheden
    range: Reëel getal
    required: true

enums:
  Aansluitingcategorie:
    see_also:
      - asg:hoofdstuk=1&g=2026-02-21
    permissible_values:
      G1A:
      G2A:
      G2C:
      GGV:
      GIN:
      GIS:
      GXX:
  Bepalingsmethode:
    permissible_values:
      DYN:
        description: dynamisch berekend
      FBR:
        description: fallback regime
  Energierichting:
    permissible_values:
      afname:
        meaning: begrip:3j33z #afname
      invoeding:
        meaning: begrip:j8cpp #invoeding
  Herkomstindicatie:
    permissible_values:
      berekend:
      fysieke opname:
      gemeten door MV:
      "gemeten door MV: update":
      klantstand:
      overeengekomen:
      P4-stand:
